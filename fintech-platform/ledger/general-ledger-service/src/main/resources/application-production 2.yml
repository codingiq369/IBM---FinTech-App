# Environment profile: production
# Activated via SPRING_PROFILES_ACTIVE=production (see environments/production/.env).
# Minimal actuator surface, no SQL/error detail leakage, larger connection pool.

logging:
  level:
    root: WARN
    com.fintechplatform: WARN

spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
