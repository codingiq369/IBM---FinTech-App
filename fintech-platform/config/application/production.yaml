# Overrides on top of defaults.yaml for production.
# Matches SPRING_PROFILES_ACTIVE=production and apps/web-banking/.env.production.

logging:
  level: WARN

observability:
  tracing_sample_rate: 0.1

http:
  cors_allowed_origins: ["https://banking.fintech.example.com"]

database:
  connection_pool:
    max_size: 20
    min_idle: 5

resilience:
  retry_max_attempts: 2
