server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side routing, so any path that isn't a real
    # file (e.g. /accounts, /transactions) must still serve index.html and
    # let the browser-side router take over — otherwise a direct navigation
    # or refresh on those URLs 404s at the web server.
    location / {
        try_files $uri /index.html;
    }
}
