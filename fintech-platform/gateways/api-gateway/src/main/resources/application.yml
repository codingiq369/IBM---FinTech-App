server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/customers/**
        - id: accounts-service
          uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/accounts/**
        - id: ledger-service
          uri: ${LEDGER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/ledger/**
        - id: transfers-service
          uri: ${TRANSFERS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/transfers/**
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
