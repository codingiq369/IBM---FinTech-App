# Runs the implemented vertical slices (customer -> accounts -> ledger ->
# transfers, and cards -> card-authorization -> ledger) plus a shared
# single-node Kafka broker, the notification-orchestrator consumer, the
# gateway, and the web-banking UI as one stack. Plain `docker compose up
# --build` here (no --env-file) uses the defaults below, which match the
# quickstart in the root README exactly -- nothing about that command
# changes.
#
# Kafka is KRaft-mode (no ZooKeeper), single broker, no replication -- a
# local/demo topology only, matching every other piece of this stack (one
# Postgres instance, no HA anywhere). See
# docs/architecture/architecture-decisions/ADR-0003-event-bus.md and
# messaging/kafka/topics/transaction-events.yaml for what's on it and why.
#
# To run this same stack shaped like a specific environment (its Spring
# profile, its ports, its CORS origin), pass that environment's .env file:
#
#   docker compose --env-file ../../environments/development/.env -f docker-compose.yml up --build
#   docker compose --env-file ../../environments/staging/.env     -f docker-compose.yml up --build
#   docker compose --env-file ../../environments/uat/.env         -f docker-compose.yml up --build
#   docker compose --env-file ../../environments/production/.env -f docker-compose.yml up --build
#
# The real staging/uat/production environments are not meant to run from a
# laptop via docker-compose long-term -- that's what infrastructure/terraform
# and infrastructure/kubernetes/overlays are for. This lets you reproduce an
# environment's profile and CORS/logging behavior locally before it ever
# reaches a cluster, and each environment's .env uses different host ports
# and a different COMPOSE_PROJECT_NAME so more than one can run at once.
name: ${COMPOSE_PROJECT_NAME:-fintech-platform-slice}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      POSTGRES_DB: ${POSTGRES_DB:-fintech}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintech}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # Internal traffic (every service in this compose file) always
      # targets kafka:9092, the same way every service always targets
      # postgres:5432 regardless of environment -- only the host-exposed
      # debug listener's advertised port varies per environment.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Single broker, so a replication factor above 1 isn't possible;
      # 3 partitions matches messaging/kafka/topics/transaction-events.yaml
      # even though, on one broker, this is about matching that intended
      # config more than buying real parallelism.
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  customer-service:
    build:
      context: ../../services/customer/customer-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      DB_USERNAME: ${POSTGRES_USER:-fintech}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${CUSTOMER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  ledger-service:
    build:
      context: ../../ledger/general-ledger-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      DB_USERNAME: ${POSTGRES_USER:-fintech}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${LEDGER_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy

  accounts-service:
    build:
      context: ../../services/accounts/account-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/accounts_db
      DB_USERNAME: ${POSTGRES_USER:-fintech}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      LEDGER_SERVICE_URL: http://ledger-service:8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${ACCOUNTS_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_started
      ledger-service:
        condition: service_started

  transfers-service:
    build:
      context: ../../services/transfers/internal-transfer-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transfers_db
      DB_USERNAME: ${POSTGRES_USER:-fintech}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      ACCOUNTS_SERVICE_URL: http://accounts-service:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${TRANSFERS_SERVICE_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      accounts-service:
        condition: service_started
      ledger-service:
        condition: service_started
      kafka:
        condition: service_healthy

  card-management-service:
    build:
      context: ../../services/cards/card-management-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/card_management_db
      DB_USERNAME: ${POSTGRES_USER:-fintech}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      ACCOUNTS_SERVICE_URL: http://accounts-service:8082
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${CARD_MANAGEMENT_SERVICE_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      accounts-service:
        condition: service_started

  card-authorization-service:
    build:
      context: ../../services/cards/card-authorization-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/card_authorization_db
      DB_USERNAME: ${POSTGRES_USER:-fintech}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      CARD_MANAGEMENT_SERVICE_URL: http://card-management-service:8085
      ACCOUNTS_SERVICE_URL: http://accounts-service:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${CARD_AUTHORIZATION_SERVICE_PORT:-8086}:8086"
    depends_on:
      postgres:
        condition: service_healthy
      card-management-service:
        condition: service_started
      accounts-service:
        condition: service_started
      ledger-service:
        condition: service_started
      kafka:
        condition: service_healthy

  notification-orchestrator:
    build:
      context: ../../services/notifications/notification-orchestrator
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notifications_db
      DB_USERNAME: ${POSTGRES_USER:-fintech}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8087}:8087"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: ../../gateways/api-gateway
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      ACCOUNTS_SERVICE_URL: http://accounts-service:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
      TRANSFERS_SERVICE_URL: http://transfers-service:8084
      CARD_MANAGEMENT_SERVICE_URL: http://card-management-service:8085
      CARD_AUTHORIZATION_SERVICE_URL: http://card-authorization-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-orchestrator:8087
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - customer-service
      - accounts-service
      - ledger-service
      - transfers-service
      - card-management-service
      - card-authorization-service
      - notification-orchestrator

  web-banking:
    build:
      context: ../../apps/web-banking
      args:
        # Vite bakes this into the built JS at image-build time (see the
        # comment in apps/web-banking/Dockerfile), so it has to be a build
        # arg, not a runtime `environment:` entry like the services above.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_BANKING_PORT:-3000}:80"
    depends_on:
      - api-gateway

volumes:
  postgres-data:
