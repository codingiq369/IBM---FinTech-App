# Reference for the "pull-request" pipeline stage -- NOT an executable GitHub
# Actions workflow. GitHub only runs workflow files that live directly
# under .github/workflows/ (no subdirectories), so the runnable
# implementation of this stage lives there instead. This file documents
# what that implementation does and who calls it, so the stage is
# discoverable from ci-cd/ the same way environments/<env>/*/README.md
# points at where each environment's real config actually lives.

stage: pull-request
purpose: 'PR gate: unit tests, then a build-only image build (push: false), then integration
  tests.'
canonical_workflow: .github/workflows/pull-request.yml
called_by:
- .github/workflows/ci.yml
