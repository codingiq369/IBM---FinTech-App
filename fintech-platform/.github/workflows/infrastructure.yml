name: Infrastructure

on:
  pull_request:
    paths: ['infrastructure/terraform/**']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, uat, production]
        required: true
      action:
        type: choice
        options: [plan, apply]
        default: plan

jobs:
  plan-on-pr:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, uat, production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt check
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive
      - name: init (no backend -- just enough to validate)
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false
      - name: validate
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform validate

  apply-on-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: init
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: terraform init
      - name: plan
        if: github.event.inputs.action == 'plan'
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: terraform plan
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
      - name: apply
        if: github.event.inputs.action == 'apply'
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
