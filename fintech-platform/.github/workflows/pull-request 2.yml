name: Pull request checks

on:
  workflow_call:

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml

  build-only:
    needs: unit-tests
    uses: ./.github/workflows/build.yml
    with:
      image_tag: pr-${{ github.sha }}
      push: false

  integration-tests:
    needs: build-only
    uses: ./.github/workflows/integration-tests.yml
