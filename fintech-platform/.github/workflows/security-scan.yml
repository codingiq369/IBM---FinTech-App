name: Security scan

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

jobs:
  image-scan:
    strategy:
      fail-fast: false
      matrix:
        service: [customer-service, accounts-service, ledger-service, transfers-service, api-gateway, web-banking]
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ inputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (web-banking)
        working-directory: apps/web-banking
        run: npm audit --audit-level=high
