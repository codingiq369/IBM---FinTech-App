# Managed by Kustomize. Base is environment-agnostic; overlays/<env>/patches/ supplies replicas, resources, image tags, and env-specific config.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backend-services
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [customer-service, accounts-service, ledger-service, transfers-service]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [api-gateway, accounts-service, transfers-service]
