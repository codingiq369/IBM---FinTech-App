# Managed by Kustomize. Base is environment-agnostic; overlays/<env>/patches/ supplies replicas, resources, image tags, and env-specific config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-banking
  labels:
    app: web-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-banking
  template:
    metadata:
      labels:
        app: web-banking
    spec:
      serviceAccountName: web-banking
      containers:
        - name: web-banking
          image: ghcr.io/fintech-platform/web-banking:latest
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: fintech-config

          env:
            []
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
