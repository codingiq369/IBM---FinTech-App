# Managed by Kustomize. Base is environment-agnostic; overlays/<env>/patches/ supplies replicas, resources, image tags, and env-specific config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  labels:
    app: ledger-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      serviceAccountName: ledger-service
      containers:
        - name: ledger-service
          image: ghcr.io/fintech-platform/ledger-service:latest
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: fintech-config
            - secretRef:
                name: fintech-db-credentials
          env:
            - name: DB_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/ledger_db"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
