# Managed by Kustomize.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: ledger-service
          image: ghcr.io/fintech-platform/ledger-service:staging-latest
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
