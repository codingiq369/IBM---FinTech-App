server:
  port: 8086

spring:
  application:
    name: card-authorization-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/card_authorization_db}
    username: ${DB_USERNAME:fintech}
    password: ${DB_PASSWORD:fintech}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Best-effort publishing (see CardAuthorizationEventPublisher): a
      # handful of retries so a transient broker blip doesn't drop an
      # event, but never more patience than that — this must never become
      # the slow part of a purchase authorization.
      retries: 3
      properties:
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000

services:
  card-management-service:
    base-url: ${CARD_MANAGEMENT_SERVICE_URL:http://localhost:8085}
  accounts-service:
    base-url: ${ACCOUNTS_SERVICE_URL:http://localhost:8082}
  ledger-service:
    base-url: ${LEDGER_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
