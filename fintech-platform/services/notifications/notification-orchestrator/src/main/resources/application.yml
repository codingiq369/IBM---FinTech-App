server:
  port: 8087

spring:
  application:
    name: notification-orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications_db}
    username: ${DB_USERNAME:fintech}
    password: ${DB_PASSWORD:fintech}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-orchestrator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
